# vagrant equivalent of AWS redis service
- hosts: redis
  name: "Vagrant redis Server to mimic AWS ElastiCache"
  tags: redis
  become: true
  tasks:
    - name: Install redis
      ansible.builtin.apt:
        name: redis
    - name: Make redis listen on 0.0.0.0
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^bind 127.0.0.1"
        line: "bind 0.0.0.0"
      notify:
        - Restart redis
  handlers:
    - name: Restart redis
      ansible.builtin.service:
        name: redis
        state: restarted
