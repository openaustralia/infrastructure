# FIRST: make sure you can read the vault passphrases. They come from the
# OAF 1Password account via bin/ansible-vault-client (see `vault_identity_list`
# in `ansible.cfg`). Sign in with: op signin --account oaforgau
# If you only have access to some vault ids, override the list using a `.envrc`
# entry listing just those ids, e.g.:
# export ANSIBLE_VAULT_IDENTITY_LIST="default@bin/ansible-vault-client,ec2@bin/ansible-vault-client,all@bin/ansible-vault-client"

## THEN

# Run this like so:
# ansible-playbook site.yml

# To only run this for planningalerts:
# ansible-playbook site.yml -l planningalerts

# To only run this for openaustralia:
# ansible-playbook site.yml -l openaustralia

# To show the value of an encrypted variable:
# ansible planningalerts -m debug -a 'var=mysql_password_production'
# Note that some values are different in development
# ansible development -m debug -a 'var=rds_admin_password'
#
# To encrypt a variable to the default vault id (requires ansible >=2.5.0):
#   ansible-vault encrypt_string --encrypt-vault-id default --name name secret
# To encrypt a variable to the EC2 vault id:
#   ansible-vault encrypt_string --encrypt-vault-id ec2 --name name secret
# See ansible.cfg for notes about which vault id to use.

# Use terraform (see terraform directory) to actually provision ec2 infrastructure

- name: Validate not in multiple requires_ groups
  hosts: all
  gather_facts: false
  tags: facts
  tasks:
    - name: Ensure host is not in multiple requires_* groups
      ansible.builtin.assert:
        that:
          - "(['requires_mysql', 'requires_postgresql'] | select('in', group_names) | list | length) <= 1"
        fail_msg: "{{ inventory_hostname }} is in multiple exclusive groups: {{ ['requires_mysql', 'requires_postgresql'] | select('in', group_names) | list }}"

# Ensure python3 is available for Ansible (required before gather_facts)
- hosts: all
  become: true
  gather_facts: false
  tags: python
  tasks:
    - name: Install python3 for Ansible if it is missing
      ansible.builtin.raw: >-
        test -e /usr/bin/python3 ||
        (apt -y update && apt install -y python3)
      changed_when: false

- hosts: all
  name: "Install python3 requirements"
  tags:
    - python
    - python3
  become: true
  tasks:
    - name: Install python packages
      tags: python
      ansible.builtin.apt:
        pkg: "{{ item }}"
        cache_valid_time: 300
      loop:
        - python3-pip
        - python3-pymysql
        - python3-psycopg2

    - name: Install boto3 which is required for EC2 stuff
      tags: python
      ansible.builtin.pip: name=boto3

- hosts: ec2
  name: "Gather RDS facts"
  tags:
    - rds
    - facts
  become: true
  tasks:
    - name: Get information about the RDS instance
      amazon.aws.rds_instance_info:
        access_key: "{{ aws_access_key }}"
        secret_key: "{{ aws_secret_key }}"
        db_instance_identifier: "{{ db_name }}"
        region: "{{ ec2_region }}"
      register: rds_database
      tags:
      - facts
      - rds
      # Run this task even when running ansible-playbook with "--check"
      check_mode: false
      when: "db_name is defined"

    - name: Display information about the RDS database
      ansible.builtin.debug:
        var: "rds_database"
      tags:
        - facts
        - rds
      when: "(show_rds_debug | default(false) | bool) and (db_name is defined)"

    - name: Get information about the planningalerts RDS instance
      amazon.aws.rds_instance_info:
        access_key: "{{ aws_access_key }}"
        secret_key: "{{ aws_secret_key }}"
        db_instance_identifier: "{{ planningalerts_db_name }}"
        region: "{{ ec2_region }}"
      register: rds_planningalerts
      tags:
        - facts
        - rds
      # Run this task even when running ansible-playbook with "--check"
      check_mode: false
      when: "planningalerts_db_name is defined"

    - name: Displays information about the planningalerts RDS instance
      ansible.builtin.debug:
        var: "rds_planningalerts"
      tags:
        - facts
        - rds
      when: "(show_rds_debug | default(false) | bool) and (planningalerts_db_name is defined)"

- hosts: all
  tags: base-server
  become: true
  name: "Install base server packages"
  roles:
    - internal/base-server

- hosts: all
  tags: swap
  become: true
  name: "Configure swap file"
  roles:
    - role: geerlingguy.swap
      when: swap_file_size_mb is defined or (swap_file_state | default('present')) == 'absent'

- hosts: "all:!righttoknow" # Exclude RTK - Workaround for Issue #523
  name: "Remove unused ruby managers"
  become: true
  tags:
    - cleanup
    - ruby
  tasks:
    - name: Remove rbenv
      tags:
        - rbenv
      ansible.builtin.import_role:
        name: internal/remove_rbenv
      vars:
        rbenv_users:
          - deploy
      when: "ruby_manager != 'rbenv'"
    - name: Remove rvm
      ansible.builtin.import_role:
        name: internal/remove_rvm
      tags:
        - rvm
      when: "ruby_manager != 'rvm'"
    - name: Remove mise
      ansible.builtin.import_role:
        name: internal/remove_mise
      tags:
        - mise
      when: "ruby_manager != 'mise'"

- hosts: "all:!righttoknow" # Exclude RTK - Workaround for Issue #523
  name: "Setup ruby managers and install versions"
  become: true
  tags:
    - ruby
  tasks:
    # NOTE: rbenv uses the latest bin/ruby-build so there will usually be changes if you are checking
    - name: Install rbenv
      ansible.builtin.import_role:
        name: external/zzet.rbenv
      vars:
        rbenv:
          env: user
          version: v1.1.2
          default_ruby: "{{ ruby_versions | default(['']) | first }}"
          rubies: "{{ ruby_versions | default([]) | map('community.general.dict_kv', 'version') | list }}"
        rbenv_users:
          - deploy
      when: "ruby_manager == 'rbenv'"
    - name: Install rvm
      ansible.builtin.import_role:
        name: external/rvm.ruby
      vars:
        rvm1_rubies: "{{ ruby_versions }}"
        rvm1_install_flags: "--auto-dotfiles"
        rvm1_install_path: /usr/local/rvm
        rvm1_user: root
        rvm1_gpg_key_server: "hkps://keyserver.ubuntu.com"
      when: "ruby_manager == 'rvm'"
      # may need this for planningalerts
      # rvm1_rvm_version: "head"
      # rvm1_gpg_key_server: 'rvm1_gpg_key_server: "hkps://keyserver.ubuntu.com"'

    # Add deploy user to group rvm
    - name: Add deploy user to rvm group
      ansible.builtin.import_role:
        name: internal/rvm.group
      when: "ruby_manager == 'rvm'"

