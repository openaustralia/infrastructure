---
roles:
  - src: ANXS.ntp
    version: v2.0.0

  - src: jnv.unattended-upgrades
    version: v1.0.1

  - src: nickhammond.logrotate
    # Version 0.0.3 contains the fix
    # https://github.com/nickhammond/ansible-logrotate/commit/3e0c0895245b451120043a68b313cd1eadccda16
    version: v0.0.3

  - src: rvm.ruby
    # Switch to latest version as of Jan 2019
    version: v2.1.2

  - src: MichaelRigart.aliases
    version: bfffd92efff476f5a685ebd53d265f78babb48af

  - src: zzet.rbenv
    # Latest version as of Aug 2024
    # Need to upgrade from 3.4.7 to include the fix
    # https://github.com/zzet/rbenv/commit/8d0f552cf4375688dc302220da280b6cc01c8d25
    version: 3.6.0

  - src: newrelic.newrelic-infra
    version: 0.5.0

  - src: geerlingguy.swap
    version: 2.0.0

collections:
  - name: community.postgresql
    # Pinned so a future release can't silently start requiring a newer ansible-core than our
    # 2.10.17 (see requirements.txt) - the same way amazon.aws 5.0.0+ did below. Currently also
    # the latest available release.
    version: 4.2.0
  - name: amazon.aws
    # Pinned to the last release supporting our ansible-core 2.10.17 (see requirements.txt);
    # 5.0.0+ requires ansible-core >=2.11.0 and fails to load ("'super' object has no
    # attribute 'get_options'").
    version: 4.5.0
  - name: community.aws
    # Must stay version-matched to amazon.aws above (community.aws 4.5.0 depends on
    # amazon.aws >=4.4.0): remote-side community.aws modules (e.g. rds) import internals from
    # amazon.aws's module_utils, so an unmatched pair fails at runtime on the target host
    # ("ImportError: cannot import name 'HAS_BOTO'" - removed from amazon.aws 4.x, but the
    # community.aws version bundled inside the ansible==2.10.7 pip package still expects it).
    version: 4.5.0
