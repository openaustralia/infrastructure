---
# tasks file for base-server
- name: Ensure git is installed
  ansible.builtin.apt:
    pkg: git

# Setup timezone stuff

- name: Install tzdata package
  ansible.builtin.apt: pkg=tzdata state=present

- name: Install ACL (required for Ansible to work)
  ansible.builtin.apt: pkg=acl state=present

# We have to do it like this for Ubuntu 16.04
# See https://bugs.launchpad.net/ubuntu/+source/tzdata/+bug/1554806
- name: Link to correct timezone
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Australia/Sydney
    dest: /etc/localtime
    state: link
  notify: Update timezone

# Forward local mail to somewhere it gets read
- name: Configure /etc/aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  notify: Update mail aliases
  tags: [aliases]

# Automatic security updates
- name: Install unattended-upgrades
  ansible.builtin.apt:
    pkg: unattended-upgrades
  tags: [unattended-upgrades]

- name: Enable automatic package list updates and upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  tags: [unattended-upgrades]

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    src: 50unattended-upgrades
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  tags: [unattended-upgrades]

# Time synchronisation via systemd-timesyncd (the Ubuntu default),
# which replaced the ntpd previously installed by ANXS.ntp
- name: Remove ntpd
  ansible.builtin.apt:
    pkg: ntp
    state: absent
    purge: true
  tags: [ntp]

- name: Install systemd-timesyncd
  ansible.builtin.apt:
    pkg: systemd-timesyncd
  when: ansible_distribution_version is version('20.04', '>=')
  tags: [ntp]

- name: Enable and start systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags: [ntp]

