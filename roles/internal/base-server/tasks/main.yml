---
# tasks file for base-server
- name: Ensure git is installed
  ansible.builtin.apt:
    pkg: git

# Setup timezone stuff

- name: Install tzdata package
  ansible.builtin.apt: pkg=tzdata state=present

- name: Install ACL (required for Ansible to work)
  ansible.builtin.apt: pkg=acl state=present

# We have to do it like this for Ubuntu 16.04
# See https://bugs.launchpad.net/ubuntu/+source/tzdata/+bug/1554806
- name: Link to correct timezone
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Australia/Sydney
    dest: /etc/localtime
    state: link
  notify: Update timezone

# Forward local mail to somewhere it gets read
- name: Configure /etc/aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  notify: Update mail aliases
  tags: [aliases]

# Automatic security updates
- name: Install unattended-upgrades
  ansible.builtin.apt:
    pkg: unattended-upgrades
  tags: [unattended-upgrades]

- name: Enable automatic package list updates and upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  tags: [unattended-upgrades]

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    src: 50unattended-upgrades
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  tags: [unattended-upgrades]

# Time synchronisation via systemd-timesyncd (the Ubuntu default),
# which replaced the ntpd previously installed by ANXS.ntp
- name: Remove ntpd
  ansible.builtin.apt:
    pkg: ntp
    state: absent
    purge: true
  tags: [ntp]

- name: Install systemd-timesyncd
  ansible.builtin.apt:
    pkg: systemd-timesyncd
  when: ansible_distribution_version is version('20.04', '>=')
  tags: [ntp]

- name: Enable and start systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  # In check mode the package install above is only simulated, so on a host that
  # still runs ntpd the unit doesn't exist yet and this task can't find it
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [ntp]

# New Relic infrastructure agent, via New Relic's officially recommended install role.
# Skipped where the credentials aren't defined (e.g. development) - unlike the old
# newrelic.newrelic-infra role there is no uninstall path, so dev boxes simply never
# get the agent.
- name: Install New Relic infrastructure agent
  ansible.builtin.import_role:
    name: newrelic.newrelic_install
  vars:
    targets: [infrastructure]
  environment:
    NEW_RELIC_API_KEY: "{{ newrelic_api_key | default('') }}"
    NEW_RELIC_ACCOUNT_ID: "{{ newrelic_account_id | default('') }}"
    NEW_RELIC_REGION: "{{ newrelic_region | default('US') }}"
  when: newrelic_api_key is defined and newrelic_account_id is defined
  tags: [newrelic]

