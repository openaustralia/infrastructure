---
- name: Install dependency for postgresql_db
  ansible.builtin.apt:
    pkg: python3-psycopg2

- name: Ensure that we have the docker repository
  ansible.builtin.deb822:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: '{{ ansible_distribution_release }}'
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  notify: Update apt cache

- name: Flush handlers to update apt cache immediately
  ansible.builtin.meta: flush_handlers

- name: Install docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io

- name: Install dependency for ansible mysql_db module
  ansible.builtin.apt:
    name: python3-mysqldb

- name: Install pip
  ansible.builtin.apt:
    name: python3-pip

- name: Install docker-compose python library
  ansible.builtin.pip:
    name: docker-compose

- name: Create database
  community.postgresql.postgresql_db:
    login_host: "{{ db_host }}"
    login_user: root
    login_password: "{{ rds_admin_password }}"
    name: "metabase"

- name: Create posgresql role
  community.postgresql.postgresql_user:
    login_host: "{{ db_host }}"
    login_user: root
    login_password: "{{ rds_admin_password }}"
    db: "metabase"
    name: "metabase"
    password: "{{ db_password }}"
    priv: ALL
    no_password_changes: true

- name: Create /srv/www directory
  ansible.builtin.file:
    state: directory
    owner: deploy
    group: deploy
    mode: '0755'
    path: /srv/www

- name: Copy across docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /srv/www/docker-compose.yml
    mode: '0644'

- name: Run metabase
  community.docker.docker_compose_v2:
    project_src: /srv/www
