# For local development (under vagrant we don't want the cron jobs generating email)
- name: "Set cron variables"
  cronvar:
    name: MAILTO
    # Also sends to #righttoknow-log slack channel
    value: web-administrators@openaustralia.org,k6g2t1e7e6u1p0f2@oaf.slack.com
    cron_file: "{{ item }}"
  with_items: "{{ ['staging'] if 'righttoknow_staging' in group_names else ( ['production'] if 'righttoknow_production' in group_names else [] ) }}"
  when: "'ec2' in group_names"

# Every job below is wrapped in `sentry monitor run`, which reports a check-in
# when the job starts and finishes so Sentry can alert on a job that fails, runs
# too long, or stops running at all (openaustralia/righttoknow#1004). The
# wrapper reads the project from SENTRY_DSN, which cron does not inherit from
# anywhere else, so set it here for the whole crontab file. Each job passes its
# own schedule, so the monitors are created and kept in step from here rather
# than being configured by hand in Sentry.
- name: "Set Sentry DSN for cron monitor check-ins"
  cronvar:
    name: SENTRY_DSN
    value: "{{ sentry_dsn }}"
    cron_file: "{{ item }}"
  with_items: "{{ ['staging'] if 'righttoknow_staging' in group_names else ( ['production'] if 'righttoknow_production' in group_names else [] ) }}"

# Every 5 minutes
# */5 * * * * !!(*= $user *)!! !!(*= $vhost_dir *)!!/!!(*= $vcspath *)!!/commonlib/bin/run-with-lockfile.sh -n !!(*= $vhost_dir *)!!/change-xapian-database.lock "!!(*= $vhost_dir *)!!/!!(*= $vcspath *)!!/script/update-xapian-index verbose=true" >> !!(*= $vhost_dir *)!!/!!(*= $vcspath *)!!/log/update-xapian-index.log || echo "stalled?"
- name: Add alaveteli crontab - update-xapian-index
  cron:
    user: deploy
    name: "update-xapian-index"
    minute: "0,5,10,15,20,25,30,35,40,45,50,55"
    job: "/bin/bash -l -c 'cd /srv/www/{{ item }}/current && RAILS_ENV=production sentry monitor run update-xapian-index -s \"0,5,10,15,20,25,30,35,40,45,50,55 * * * *\" -e {{ item }} --check-in-margin 15 --max-runtime 30 --timezone Australia/Sydney --failure-issue-threshold 2 -- rtk-cron-lock ./change-xapian-database.lock \"./script/update-xapian-index verbose=true\" >> ./log/update-xapian-index.log || echo \"stalled?\"'"
    cron_file: "{{ item }}"
    state: "{{ cron_enabled | ternary('present', 'absent')}}"
  with_items: "{{ ['staging'] if 'righttoknow_staging' in group_names else ( ['production'] if 'righttoknow_production' in group_names else [] ) }}"

# Every 10 minutes
# 0,10,20,30,40,50 * * * * !!(*= $user *)!! !!(*= $vhost_dir *)!!/!!(*= $vcspath *)!!/commonlib/bin/run-with-lockfile.sh -n !!(*= $vhost_dir *)!!/send-batch-requests.lock !!(*= $vhost_dir *)!!/!!(*= $vcspath *)!!/script/send-batch-requests || echo "stalled?"
- name: Add alaveteli crontab entry - send-batch-requests
  cron:
    user: deploy
    name: "send-batch-requests"
    minute: "0,10,20,30,40,50"
    job: "/bin/bash -l -c 'cd /srv/www/{{ item }}/current && RAILS_ENV=production sentry monitor run send-batch-requests -s \"0,10,20,30,40,50 * * * *\" -e {{ item }} --check-in-margin 15 --max-runtime 30 --timezone Australia/Sydney --failure-issue-threshold 2 -- rtk-cron-lock ./send-batch-requests.lock ./script/send-batch-requests || echo \"stalled?\"'"
    cron_file: "{{ item }}"
    state: "{{ cron_enabled | ternary('present', 'absent')}}"
  with_items: "{{ ['staging'] if 'righttoknow_staging' in group_names else ( ['production'] if 'righttoknow_production' in group_names else [] ) }}"

# Once an hour
