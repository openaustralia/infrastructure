---

- name: "Include OS-specific variables."
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"

- name: Install dependencies (Ubuntu 18.04 and earlier)
  ansible.builtin.apt: "name={{ item }}"
  with_items:
    - cron
    - gzip
    - python-boto
    - s3cmd
  when: ansible_distribution_release not in ['focal', 'jammy']

- name: Install dependencies (Ubuntu 20.04 and 22.04)
  ansible.builtin.apt: "name={{ item }}"
  with_items:
    - cron
    - gzip
    - python3-boto3
    - s3cmd
  when: ansible_distribution_release in ['focal', 'jammy']

- name: Set duplicity package name
  ansible.builtin.set_fact: "backup_duplicity_pkg={{ backup_duplicity_pkg }}={{ backup_duplicity_version }}"
  when: backup_duplicity_version

- name: Install duplicity
  ansible.builtin.apt: "pkg={{ backup_duplicity_pkg }}"
