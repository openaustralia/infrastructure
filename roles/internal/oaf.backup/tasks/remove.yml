---
# Uninstall the role

- name: Uninstall the role - pt. 1
  ansible.builtin.file:
   state: absent
   path: /etc/cron.d/backup

- name: Uninstall the role - pt. 2
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  with_items:
    - "{{ backup_home }}"
    - "{{ backup_work }}"
    - "{{ backup_logdir }}"
