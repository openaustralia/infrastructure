---
# tasks file for umami
#
# Umami (https://umami.is) is a privacy-focused analytics platform. It runs as
# a single container against the shared RDS PostgreSQL instance, with nginx in
# front terminating TLS. The public name is proxied by Cloudflare.

- name: Install nginx and the postgresql client library
  apt:
    pkg:
      - nginx
      - python3-psycopg2
    state: present

# =============================================================================
# Docker
# =============================================================================
# Installed from Docker's own apt repository using a signed-by keyring. Note
# that community.docker is pinned at 1.2.2 by ansible 2.10, which has no
# docker_compose_v2, and docker-compose v1 no longer installs cleanly from pip.
# Umami is a single container, so docker_container avoids both problems.

- name: Create the apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add the Docker apt signing key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add the Docker apt repository
  apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    update_cache: true

- name: Install docker
  apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      # How docker_container talks to the daemon
      - python3-docker
    state: present

# =============================================================================
# Database
# =============================================================================
# On the shared RDS instance, so it inherits that instance's backups. Umami
# applies its own schema migrations on startup.
#
# Follows roles/internal/planningalerts/tasks/database.yml. Why the database is
# not owned by the umami role, and why both grants below are needed for
# different reasons, is documented in this role's README under "Database
# grants". Order matters here: the role is created second because that task
# connects to the umami database, which has to exist first.

- name: Create the umami database
  community.postgresql.postgresql_db:
    login_host: "{{ db_host }}"
    login_user: root
    login_password: "{{ rds_admin_password }}"
    name: "{{ umami_db_name }}"

- name: Create the umami postgresql role
  community.postgresql.postgresql_user:
    login_host: "{{ db_host }}"
    login_user: root
    login_password: "{{ rds_admin_password }}"
    db: "{{ umami_db_name }}"
    name: "{{ umami_db_user }}"
    password: "{{ db_password }}"
    no_password_changes: true

- name: Give the umami role access to the database
  community.postgresql.postgresql_privs:
    login_host: "{{ db_host }}"
    login_user: root
    login_password: "{{ rds_admin_password }}"
    db: "{{ umami_db_name }}"
    roles: "{{ umami_db_user }}"
    privs: ALL
    type: database

- name: Give the umami role access to the public schema
  community.postgresql.postgresql_privs:
    login_host: "{{ db_host }}"
    login_user: root
    login_password: "{{ rds_admin_password }}"
    db: "{{ umami_db_name }}"
    roles: "{{ umami_db_user }}"
    privs: ALL
    type: schema
    objs: public

# =============================================================================
# nginx and TLS
# =============================================================================

- name: Restore real client IPs from the Cloudflare proxy
  include_role:
    name: cloudflare_realip
  vars:
    cloudflare_webserver: nginx

- name: Create the certbot webroot
  file:
    path: "{{ umami_certbot_webroot }}/.well-known/acme-challenge"
    state: directory
    mode: '0755'

- name: Configure the nginx site
  include_tasks: nginx-site.yml

# certbot validates over HTTP, so nginx has to be serving the challenge
# directory before we ask for a certificate
- name: Reload nginx before requesting a certificate
  meta: flush_handlers

- name: Install certificate using certbot
  include_role:
    name: oaf.certbot
  vars:
    certbot_certs:
      - email: "{{ umami_certbot_email }}"
        domains:
          - "{{ umami_domain }}"
  when: "'ec2' in group_names"

# Second pass: the TLS server block is only rendered once the certificate
# exists, so re-running this is what completes a first run on a fresh box
- name: Reconfigure the nginx site now the certificate exists
  include_tasks: nginx-site.yml
  when: "'ec2' in group_names"

# =============================================================================
# Umami
# =============================================================================

# no_log because docker_container returns the container's full inspect output,
# including Config.Env, which holds the database password and APP_SECRET. That
# return value is not suppressed by diff mode, so it leaks at -v and to any
# callback that logs results. diff is off as well so that the diff path stays
# closed if someone flips no_log off to debug a failure here; if you need to,
# prefer `docker logs umami` first.
- name: Run umami
  no_log: true
  community.docker.docker_container:
    name: umami
    image: "{{ umami_docker_image }}"
    ports:
      - "127.0.0.1:{{ umami_port }}:3000"
    env:
      DATABASE_URL: "{{ umami_database_url }}"
      APP_SECRET: "{{ umami_app_secret }}"
      # nginx sets this on every proxied request from $remote_addr, which
      # cloudflare_realip has already resolved to the visitor's address. If it
      # were missing Umami would fall back to walking its own header list
      # (x-forwarded-for and friends) rather than failing, so the point of
      # setting it is to make the answer deterministic, not to catch mistakes.
      CLIENT_IP_HEADER: cf-connecting-ip
      DISABLE_TELEMETRY: "1"
    # Nothing else rotates these: the box's own logs are handled by logrotate,
    # but a container's are not, and this one gets a request per pageview.
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: '3'
    # Both of these match upstream's own docker-compose.yml. init reaps zombies
    # for the Node process; /api/heartbeat is an unauthenticated endpoint, and
    # the image installs curl for exactly this purpose.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Umami runs its prisma migrations at startup, so don't count failures
      # until those have had time to finish on a fresh database.
      start_period: 60s
    restart_policy: always
    state: started
  diff: false
